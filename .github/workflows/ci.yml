name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - run: python -m wavecal.cli audit-release --mode tracked
      - run: python -m wavecal.cli audit-release --mode archive
      - run: python -m wavecal.cli run --config examples/scilly_jason3.yml --out outputs/scilly
